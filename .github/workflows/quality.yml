name: Package quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        node: [24, 26]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
